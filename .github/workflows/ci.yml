name: CI
# Pull requests cover every branch through the merge ref, so a push run on a
# PR branch would only repeat the same checks; push runs are for main.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Privacy policy regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check workflow action pins
        run: node scripts/check-workflow-pins.mjs
      - run: npm ci
      - run: npm run check
  # Kept out of the required `verify` job: a newly published advisory for an
  # existing dependency should not turn every unrelated PR red. Dependency
  # changes are still gated by the required `dependency-review` check.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm audit --audit-level=high
